<div class="server-error-wrapper">

  <!-- Header Branding Bar (Matches SCIDMS Layout) -->
  <header class="error-header">
    <div class="header-inner">
      <div class="brand-group">
        <img src="assets/images/logo.png" alt="SCIDMS Logo" class="brand-logo" />
        <div class="brand-text">
          <h1 class="brand-name">SCIDMS</h1>
          <p class="brand-tagline">Supply Chain Inventory &amp; Distribution Management</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Error Card -->
  <main class="error-content">
    <div class="error-card">

      <h1 class="main-title">IT'S NOT YOU, IT'S US</h1>
      <p class="sub-text">We are currently unable to connect to the server. Please try again.</p>

      <!-- Retry Button -->
      <div class="action-wrapper">
        <button class="btn btn-primary btn-retry" (click)="retryConnection()" [disabled]="isChecking">
          <span *ngIf="isChecking" class="spinner"></span>
          <span>{{ isChecking ? 'Retrying...' : 'Retry' }}</span>
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="error-footer">
    &copy; 2026 SCIDMS System. All rights reserved.
  </footer>

</div>
