<aside class="sidebar">
  <!-- Brand -->
  <div class="sidebar-brand">
    <img src="assets/scidms-logo.svg" alt="SCIDMS Logo" class="brand-logo-img" />
    <span class="brand-version">SUPPLY CHAIN V1.0</span>
  </div>

  <!-- Role Badge -->
  <div class="role-badge-wrap" *ngIf="currentUser">
    <span class="role-badge">{{ roleLabel }}</span>
  </div>

  <!-- Navigation items filtered by RBAC permissions -->
  <ul class="nav-links">
    <li *ngFor="let item of visibleNavItems">
      <a [routerLink]="item.route" routerLinkActive="active">
        
        <!-- Dashboard -->
        <svg *ngIf="item.icon==='rect3'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
          <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
        </svg>

        <!-- Products -->
        <svg *ngIf="item.icon==='box'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/>
        </svg>

        <!-- Warehouses -->
        <svg *ngIf="item.icon==='home'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>

        <!-- Orders -->
        <svg *ngIf="item.icon==='cart'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
        </svg>

        <!-- Shipments -->
        <svg *ngIf="item.icon==='truck'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/>
          <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>

        <!-- Users -->
        <svg *ngIf="item.icon==='users'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
        </svg>

        <!-- Inventory -->
        <svg *ngIf="item.icon==='list'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>

        <!-- Reports -->
        <svg *ngIf="item.icon==='bar'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="20" x2="18" y2="10"/>
          <line x1="12" y1="20" x2="12" y2="4"/>
          <line x1="6"  y1="20" x2="6"  y2="14"/>
        </svg>

        <!-- Audit -->
        <svg *ngIf="item.icon==='file'" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>

        {{ item.label }}
      </a>
    </li>
  </ul>

  <!-- Bottom Options Section -->
  <div class="sidebar-bottom">
    
    <!-- Change Password Button (replaces Settings) -->
    <button class="nav-bottom-item change-pass-btn" (click)="openChangePasswordModal()" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      Change Password
    </button>

    <!-- Logout -->
    <button class="nav-bottom-item logout-btn" (click)="logout()" type="button">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Sign Out
    </button>

    <!-- Current user -->
    <div class="user-profile" *ngIf="currentUser">
      <div class="profile-avatar">{{ userInitials }}</div>
      <div class="profile-info">
        <span class="profile-name">{{ currentUser.username }}</span>
        <span class="profile-email">{{ currentUser.email }}</span>
      </div>
    </div>
  </div>
</aside>

<!-- Change Password Modal -->
<div class="modal-overlay" *ngIf="showChangePasswordModal">
  <div class="modal-card pass-modal">
    <div class="modal-header">
      <div class="header-title-flex">
        <div class="lock-icon-badge">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <div>
          <h3 class="modal-title">Change Password</h3>
          <p class="modal-subtitle">Update your account credentials safely.</p>
        </div>
      </div>
      <button type="button" class="close-btn" (click)="closeChangePasswordModal()">&times;</button>
    </div>

    <div class="modal-body">
      
      <!-- Error Message Banner -->
      <div class="msg-banner error-banner" *ngIf="changePasswordError">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span>{{ changePasswordError }}</span>
      </div>

      <!-- Success Message Banner -->
      <div class="msg-banner success-banner" *ngIf="changePasswordSuccess">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
        <span>{{ changePasswordSuccess }}</span>
      </div>

      <!-- Form Inputs -->
      <form (ngSubmit)="submitChangePassword()">
        
        <!-- Current Password -->
        <div class="form-group">
          <label class="form-label">CURRENT PASSWORD</label>
          <div class="pass-input-wrapper">
            <input 
              [type]="showCurrentPassword ? 'text' : 'password'" 
              class="form-input" 
              placeholder="Enter current password..." 
              [(ngModel)]="currentPassword" 
              name="currPass"
            />
            <button type="button" class="toggle-eye-btn" (click)="showCurrentPassword = !showCurrentPassword">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- New Password -->
        <div class="form-group">
          <label class="form-label">NEW PASSWORD</label>
          <div class="pass-input-wrapper">
            <input 
              [type]="showNewPassword ? 'text' : 'password'" 
              class="form-input" 
              placeholder="At least 8 characters..." 
              [(ngModel)]="newPassword" 
              name="newPass"
            />
            <button type="button" class="toggle-eye-btn" (click)="showNewPassword = !showNewPassword">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Confirm New Password -->
        <div class="form-group">
          <label class="form-label">CONFIRM NEW PASSWORD</label>
          <div class="pass-input-wrapper">
            <input 
              [type]="showConfirmPassword ? 'text' : 'password'" 
              class="form-input" 
              placeholder="Re-enter new password..." 
              [(ngModel)]="confirmPassword" 
              name="confPass"
            />
            <button type="button" class="toggle-eye-btn" (click)="showConfirmPassword = !showConfirmPassword">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <!-- Modal Footer Actions -->
        <div class="modal-footer-actions">
          <button type="button" class="btn btn-cancel" (click)="closeChangePasswordModal()">Cancel</button>
          <button type="submit" class="btn btn-submit-pass" [disabled]="changePasswordLoading">
            <span *ngIf="!changePasswordLoading">Update Password</span>
            <span *ngIf="changePasswordLoading">Updating...</span>
          </button>
        </div>

      </form>

    </div>
  </div>
</div>
